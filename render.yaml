# Render Blueprint — deploys email-server.cjs as an always-on backend so the
# app works from anywhere, not just your home Wi-Fi.
#
# How to use:
#   1. Push this repo to GitHub (see README/CLAUDE.md for the exact steps).
#   2. On render.com (free account, no card required): New -> Blueprint,
#      pick this repo. Render reads this file automatically.
#   3. Render will ask you to fill in the env vars marked "sync: false"
#      below — paste in your real values from .env. Never commit .env itself.
#   4. Once deployed, Render gives you a URL like
#      https://techinnosphere-email-server.onrender.com — put that in
#      .env.production as VITE_EMAIL_API_BASE, then redeploy the frontend.
#
# Free-tier note: the service spins down after 15 minutes of no traffic and
# takes ~30-50s to wake up on the next request. Fine for a BDA tool used a
# few times a day; upgrade to a paid instance if that cold-start is a problem.

services:
  - type: web
    name: techinnosphere-email-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node email-server.cjs
    envVars:
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: IMAP_HOST
        value: imap.hostinger.com
      - key: IMAP_PORT
        value: "993"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: API_KEY
        sync: false
      - key: TRACKING_URL
        sync: false
