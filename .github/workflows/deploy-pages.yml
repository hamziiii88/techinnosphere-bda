name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (GitHub Pages base path + live backend URL)
        env:
          GITHUB_PAGES: 'true'
          # Backend deployed on Render (render.yaml). This is a public URL,
          # not a secret — safe to commit directly. If the backend is ever
          # redeployed under a different URL, update this line and push.
          VITE_EMAIL_API_BASE: https://techinnosphere-email-server.onrender.com
        run: npm run build

      # public/CNAME is for the surge.sh deploy path, not this one — a stale
      # CNAME here would make GitHub Pages try to claim
      # techinnosphere-mumbai.surge.sh as a custom domain.
      - name: Drop surge.sh CNAME from this build
        run: rm -f dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
